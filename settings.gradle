pluginManagement {
    // 使本地插件 `tokay-asm` 作为包含构建参与插件解析
    includeBuild('tokay-asm')

    repositories {
        maven { url 'https://maven.mozilla.org/maven2' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/central' }

        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // GeckoView 的 AAR 只发布在 maven.mozilla.org
        maven { url 'https://maven.mozilla.org/maven2' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}
rootProject.name = "Tokay"

// 被发布的库主体
include ':tokay'
// tokay 的内部依赖：归档解压（只用来解内核 7z）
include ':tokay-archive'
// 演示应用：本仓唯一应用 `com.happyboy.tokay.asm` 插件的模块（插件要拿到 APK 的打包链路）
include ':demo'
